include: package:very_good_analysis/analysis_options.10.3.0.yaml

plugins:
  riverpod_lint: ^3.1.8

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Promote correctness diagnostics to build-breaking.
    invalid_annotation_target: error
    missing_required_param: error
    unrelated_type_equality_checks: error
    collection_methods_unrelated_type: error
    body_might_complete_normally_nullable: error

    # Deprecations stay visible but must not redline main on an SDK bump.
    # The SDK is pinned in .flutter-version, so these appear only when we
    # deliberately upgrade — at which point `make fix` usually clears them.
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

    # `todo` is an info-level diagnostic, so --fatal-infos would fail the
    # build on every `// TODO`. Ignore the diagnostic, not the practice.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.gen.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "build/**"
    # Platform directories are not Dart; `flutter analyze` appends these
    # itself if they are missing.
    - "android/**"
    - "ios/**"
    - "web/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"

formatter:
  trailing_commas: automate

linter:
  rules:
    # Calibrated for publishable packages; noise in an application.
    public_member_api_docs: false
    # The formatter owns line length; having both complain contradicts.
    lines_longer_than_80_chars: false
