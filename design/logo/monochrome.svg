<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- The themed-icon layer (Android 13+) and the notification small icon.
       One flat colour only, because the system recolours the first and draws
       the second as a pure alpha mask: the four ring colours cannot survive
       either, so the rings have to read on shape alone. -->
  <circle cx="54" cy="54" r="27" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="54" cy="54" r="19" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="54" cy="54" r="11" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="54" cy="54" r="4" fill="#FFFFFF"/>
</svg>
