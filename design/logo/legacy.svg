<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- The pre-API-26 icon: the same rings, composited onto their own rounded
       square, since a legacy launcher applies no mask of its own. -->
  <defs><clipPath id="squircle"><rect width="108" height="108" rx="24"/></clipPath></defs>
  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="#241E63"/>
    <circle cx="54" cy="54" r="27" fill="none" stroke="#FF00FF" stroke-width="4"/>
    <circle cx="54" cy="54" r="19" fill="none" stroke="#00FFFF" stroke-width="4"/>
    <circle cx="54" cy="54" r="11" fill="none" stroke="#2962FF" stroke-width="4"/>
    <circle cx="54" cy="54" r="4" fill="#FFEA00"/>
  </g>
</svg>
