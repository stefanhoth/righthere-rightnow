name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow files
        # Pinned release binary from GitHub, same pattern as the Audit job.
        # actionlint also shellchecks every `run:` block (shellcheck ships on
        # the runner).
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - run: make deps
      - run: make fmt-check
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - run: make deps
      - run: make coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    # In a stack, CI runs in full for every layer. The debug APK only carries
    # signal at the ends: a non-stack PR, the lowest unmerged layer (lands on
    # main next), or the top layer (the full change set). Middle layers skip
    # this job; a skipped required job reports green. See docs/DECISIONS.md.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.stack == null
      || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - run: make deps
      - run: flutter build apk --debug

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan pubspec.lock for known vulnerabilities
        # There is no `dart pub audit`. OSV-Scanner is Google's own scanner and
        # supports the Pub ecosystem; it reads the lockfile, not the pubspec.
        run: |
          set -euo pipefail
          VERSION="2.2.4"
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=./pubspec.lock
