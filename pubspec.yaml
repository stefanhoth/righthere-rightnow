name: righthere_rightnow
description: "A personal morning briefing: one ranked agenda from your calendar and tasks."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  android_alarm_manager_plus: ^5.1.1
  device_calendar_plus: ^0.8.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.1
  flutter_gemma: ^1.6.5
  flutter_gemma_builtin_ai: ^0.2.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  intl: ^0.20.3
  meta: ^1.19.0
  # Pinned below 13.0.x: permission_handler_android 14.0.0 needs compileSdk
  # 37, which AGP 9.1.0 (pinned in android/settings.gradle.kts) does not
  # support -- 12.x pulls in permission_handler_android ^13.0.0 instead,
  # which needs only compileSdk 35.
  permission_handler: ^12.0.1
  riverpod_annotation: ^4.0.6
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
